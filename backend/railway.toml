# Railway Deployment Configuration
# This file is used by Railway to configure the deployment

[build]
builder = "railpack"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
NODE_ENV = "production"
PORT = "5000"

# Health check configuration
[deploy.healthcheck]
path = "/health"
timeout = 30
interval = 60

[networking]
  serviceName = "glide-backend"
  
# Environment variables to set in Railway dashboard:
# - CLERK_SECRET_KEY
# - SUPABASE_URL  
# - SUPABASE_SERVICE_ROLE_KEY
# - SENDGRID_API_KEY
# - FROM_EMAIL